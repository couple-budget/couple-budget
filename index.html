<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海云 & 智翔 的共同帳本</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F3EE; --surface: #FFFFFF; --surface2: #F0EBE3;
    --ink: #2C2418; --ink2: #7A6E62; --accent: #C0714A; --accent2: #E8A882;
    --green: #4A7C59; --red: #B04A3A; --border: #DDD5C8;
    --shadow: 0 2px 16px rgba(44,36,24,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  header { background: var(--ink); color: var(--bg); padding: 18px 24px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-family: 'Noto Serif TC', serif; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.05em; }
  header span { font-size: 0.75rem; color: var(--accent2); letter-spacing: 0.08em; }
  .tabs { display: flex; background: var(--ink); border-top: 1px solid rgba(255,255,255,0.1); padding: 0 16px 8px; gap: 4px; }
  .tab-btn { flex: 1; background: transparent; border: none; color: rgba(247,243,238,0.5); font-family: 'Noto Sans TC', sans-serif; font-size: 0.78rem; padding: 8px 4px; cursor: pointer; border-radius: 8px; transition: all 0.2s; letter-spacing: 0.04em; }
  .tab-btn.active { background: var(--accent); color: white; font-weight: 500; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 12px 100px; }
  .section { display: none; } .section.active { display: block; }
  .summary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .sum-card { background: var(--surface); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .sum-card label { font-size: 0.7rem; color: var(--ink2); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .sum-card .amount { font-family: 'Noto Serif TC', serif; font-size: 1.35rem; font-weight: 700; }
  .sum-card .amount.income { color: var(--green); } .sum-card .amount.expense { color: var(--red); }
  .sum-card .sub { font-size: 0.72rem; color: var(--ink2); margin-top: 2px; }
  .settlement-card { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .settlement-card h3 { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); margin-bottom: 8px; }
  .settlement-amount { font-family: 'Noto Serif TC', serif; font-size: 1.05rem; font-weight: 700; line-height: 1.6; white-space: pre-line; margin-bottom: 12px; }
  /* CHECKLIST */
  .settle-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .settle-item { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
  .settle-item.done { opacity: 0.45; }
  .settle-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--accent2); background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; transition: all 0.2s; }
  .settle-check.checked { background: var(--accent); border-color: var(--accent); }
  .settle-info { flex: 1; min-width: 0; }
  .settle-desc { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .settle-meta { font-size: 0.7rem; color: var(--accent2); margin-top: 2px; }
  .settle-amt { font-family: 'Noto Serif TC', serif; font-size: 0.9rem; font-weight: 700; color: var(--accent2); flex-shrink: 0; }
  .settle-section-title { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent2); margin: 10px 0 6px; }
  /* MONTH BAR */
  .month-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 10px 14px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
  .month-bar button { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--ink2); padding: 2px 8px; border-radius: 6px; transition: background 0.15s; }
  .month-bar button:hover { background: var(--surface2); }
  .month-bar span { font-family: 'Noto Serif TC', serif; font-size: 0.95rem; font-weight: 600; }
  .filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); font-size: 0.75rem; cursor: pointer; transition: all 0.15s; color: var(--ink2); font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; }
  .filter-chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .record-list { display: flex; flex-direction: column; gap: 8px; }
  .record-item { background: var(--surface); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); transition: transform 0.15s; }
  .record-item:hover { transform: translateY(-1px); }
  .record-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
  .record-info { flex: 1; min-width: 0; }
  .record-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .record-meta { font-size: 0.72rem; color: var(--ink2); margin-top: 2px; }
  .record-amount { font-family: 'Noto Serif TC', serif; font-size: 1rem; font-weight: 700; flex-shrink: 0; }
  .record-amount.income { color: var(--green); } .record-amount.expense { color: var(--red); }
  .split-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; margin-left: 4px; }
  .split-badge.shared { background: #E8F0FE; color: #3B5BDB; }
  .split-badge.solo { background: #FEF3E8; color: #C0714A; }
  .cat-food { background: #FEF3E8; } .cat-transport { background: #E8F0FE; } .cat-entertainment { background: #F3E8FE; } .cat-home { background: #E8F5E9; } .cat-subscription { background: #FFF9E8; } .cat-income { background: #E8F5E9; } .cat-other { background: #F5F5F5; }
  .chart-wrap { background: var(--surface); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .chart-title { font-size: 0.8rem; color: var(--ink2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
  .bar-chart { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-label { font-size: 0.75rem; width: 60px; flex-shrink: 0; color: var(--ink2); }
  .bar-track { flex: 1; height: 10px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: var(--accent); transition: width 0.5s ease; }
  .bar-fill.alt { background: var(--green); }
  .bar-val { font-size: 0.73rem; width: 56px; text-align: right; color: var(--ink); font-weight: 500; flex-shrink: 0; }
  .person-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .person-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 0.78rem; transition: all 0.15s; color: var(--ink2); }
  .person-btn.active { border-color: var(--accent); background: var(--accent); color: white; font-weight: 500; }
  .fab { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; border: none; border-radius: 50px; padding: 14px 32px; font-size: 0.9rem; font-weight: 500; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; box-shadow: 0 4px 20px rgba(192,113,74,0.4); display: flex; align-items: center; gap: 8px; transition: transform 0.15s, box-shadow 0.15s; z-index: 50; letter-spacing: 0.04em; }
  .fab:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 6px 24px rgba(192,113,74,0.5); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(44,36,24,0.6); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg); border-radius: 24px 24px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 480px; margin: 0 auto; max-height: 92vh; overflow-y: auto; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h2 { font-family: 'Noto Serif TC', serif; font-size: 1.1rem; }
  .modal-close { background: var(--surface2); border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 1rem; color: var(--ink2); }
  .form-group { margin-bottom: 14px; }
  .form-group label { font-size: 0.78rem; color: var(--ink2); display: block; margin-bottom: 6px; letter-spacing: 0.04em; }
  .form-group input, .form-group select { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; font-size: 0.9rem; transition: border-color 0.15s; outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .type-toggle { display: flex; gap: 8px; }
  .type-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem; transition: all 0.15s; color: var(--ink2); }
  .type-btn.expense.active { background: var(--red); border-color: var(--red); color: white; }
  .type-btn.income.active { background: var(--green); border-color: var(--green); color: white; }
  .split-toggle { display: flex; gap: 8px; }
  .split-btn { flex: 1; padding: 10px 6px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-size: 0.82rem; transition: all 0.15s; color: var(--ink2); text-align: center; }
  .split-btn.active { background: var(--ink); border-color: var(--ink); color: white; }
  .sub-cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .sub-cat-btn { padding: 7px 4px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); font-size: 0.72rem; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; color: var(--ink2); transition: all 0.15s; text-align: center; }
  .sub-cat-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .submit-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: white; font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem; font-weight: 500; cursor: pointer; margin-top: 8px; transition: opacity 0.15s; letter-spacing: 0.04em; }
  .submit-btn:hover { opacity: 0.9; } .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { text-align: center; padding: 40px 20px; color: var(--ink2); font-size: 0.85rem; }
  .empty .emoji { font-size: 2rem; margin-bottom: 8px; }
  .delete-btn { background: none; border: none; color: var(--red); font-size: 0.8rem; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.15s; }
  .delete-btn:hover { background: #FEE; }
  .loading { text-align: center; padding: 30px; color: var(--ink2); font-size: 0.85rem; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: 20px; font-size: 0.82rem; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div><h1>海云 &amp; 智翔 的帳本 💑</h1></div>
  <span id="headerMonth"></span>
</header>
<div class="tabs">
  <button class="tab-btn active" onclick="switchSection('overview',this)">總覽</button>
  <button class="tab-btn" onclick="switchSection('records',this)">明細</button>
  <button class="tab-btn" onclick="switchSection('stats',this)">統計</button>
  <button class="tab-btn" onclick="switchSection('mine',this)">個人</button>
</div>
<main>
  <!-- 總覽 -->
  <div class="section active" id="sec-overview">
    <div class="month-bar">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="summary-row">
      <div class="sum-card"><label>本月支出</label><div class="amount expense" id="ov-expense">$0</div><div class="sub">全部</div></div>
      <div class="sum-card"><label>本月收入</label><div class="amount income" id="ov-income">$0</div><div class="sub">全部</div></div>
    </div>
    <div class="summary-row">
      <div class="sum-card"><label>海云🙆🏻‍♀️ 支出</label><div class="amount expense" id="ov-haiyun">$0</div></div>
      <div class="sum-card"><label>智翔💁🏿‍♂️ 支出</label><div class="amount expense" id="ov-zhixiang">$0</div></div>
    </div>
    <div class="settlement-card">
      <h3>💸 結算（平分帳目）</h3>
      <div class="settlement-amount" id="settlement-text">載入中...</div>
      <div id="settle-pending-wrap" style="display:none">
        <div class="settle-section-title">待結清項目</div>
        <div class="settle-list" id="settle-pending-list"></div>
      </div>
      <div id="settle-done-wrap" style="display:none;margin-top:12px">
        <div class="settle-section-title">已結清（7天內）</div>
        <div class="settle-list" id="settle-done-list"></div>
      </div>
    </div>
    <h3 style="font-size:0.8rem;color:var(--ink2);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px;">最近紀錄</h3>
    <div class="record-list" id="recent-list"><div class="loading">載入中...</div></div>
  </div>

  <!-- 明細 -->
  <div class="section" id="sec-records">
    <div class="month-bar">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel2"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="filter-bar">
      <div class="filter-chip active" onclick="setFilter('all',this)">全部</div>
      <div class="filter-chip" onclick="setFilter('支出',this)">支出</div>
      <div class="filter-chip" onclick="setFilter('收入',this)">收入</div>
      <div class="filter-chip" onclick="setFilter('平分',this)">🤝 平分</div>
      <div class="filter-chip" onclick="setFilter('自付',this)">👤 自付</div>
      <div class="filter-chip" onclick="setFilter('餐飲',this)">🍜 餐飲</div>
      <div class="filter-chip" onclick="setFilter('交通',this)">🚌 交通</div>
      <div class="filter-chip" onclick="setFilter('娛樂',this)">🎮 娛樂</div>
      <div class="filter-chip" onclick="setFilter('家庭',this)">🏠 家庭</div>
      <div class="filter-chip" onclick="setFilter('訂閱',this)">📱 訂閱</div>
      <div class="filter-chip" onclick="setFilter('理理',this)">🐱 理理</div>
    </div>
    <div class="record-list" id="records-list"><div class="loading">載入中...</div></div>
  </div>

  <!-- 統計 -->
  <div class="section" id="sec-stats">
    <div class="month-bar">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel3"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="chart-wrap"><div class="chart-title">各分類支出</div><div class="bar-chart" id="cat-chart"></div></div>
    <div class="chart-wrap"><div class="chart-title">兩人支出比較</div><div class="bar-chart" id="person-chart"></div></div>
  </div>

  <!-- 個人 -->
  <div class="section" id="sec-mine">
    <div class="month-bar">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel4"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="person-tabs">
      <button class="person-btn active" onclick="setPerson('海云🙆🏻‍♀️',this)">海云🙆🏻‍♀️</button>
      <button class="person-btn" onclick="setPerson('智翔💁🏿‍♂️',this)">智翔💁🏿‍♂️</button>
      <button class="person-btn" onclick="setPerson('共同',this)">共同花費</button>
    </div>
    <div class="summary-row">
      <div class="sum-card"><label>支出</label><div class="amount expense" id="p-expense">$0</div></div>
      <div class="sum-card"><label>收入</label><div class="amount income" id="p-income">$0</div></div>
    </div>
    <div id="p-solo-note" style="display:none;font-size:0.75rem;color:var(--ink2);margin-bottom:10px;padding:8px 12px;background:var(--surface);border-radius:10px;">👤 只顯示「自己承擔」的支出</div>
    <div id="p-shared-note" style="display:none;font-size:0.75rem;color:var(--ink2);margin-bottom:10px;padding:8px 12px;background:var(--surface);border-radius:10px;">🤝 兩人平分的共同花費</div>
    <div class="record-list" id="person-list"><div class="loading">載入中...</div></div>
  </div>
</main>

<button class="fab" onclick="openModal()">＋ 新增紀錄</button>
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>新增紀錄</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label>類型</label>
      <div class="type-toggle">
        <button class="type-btn expense active" id="btn-expense" onclick="setType('expense')">支出</button>
        <button class="type-btn income" id="btn-income" onclick="setType('income')">收入</button>
      </div>
    </div>
    <div class="form-group"><label>金額 (NT$)</label><input type="number" id="f-amount" placeholder="0" min="0"></div>
    <div class="form-group"><label>描述</label><input type="text" id="f-desc" placeholder="例：晚餐、捷運票..."></div>
    <div class="form-group" id="cat-group">
      <label>分類</label>
      <select id="f-cat" onchange="updateSubCat()">
        <option value="餐飲">🍜 餐飲</option>
        <option value="交通">🚌 交通</option>
        <option value="娛樂">🎮 娛樂購物</option>
        <option value="家庭">🏠 常備家庭支出</option>
        <option value="訂閱">📱 訂閱</option>
        <option value="理理">🐱 理理</option>
        <option value="其他">📦 其他</option>
      </select>
    </div>
    <div class="form-group" id="subcat-group" style="display:none">
      <label>娛樂子分類</label>
      <div class="sub-cat-grid">
        <button class="sub-cat-btn active" onclick="setSubCat('電影',this)">🎬 電影</button>
        <button class="sub-cat-btn" onclick="setSubCat('遊戲',this)">🕹️ 遊戲</button>
        <button class="sub-cat-btn" onclick="setSubCat('購物',this)">🛍️ 購物</button>
        <button class="sub-cat-btn" onclick="setSubCat('音樂',this)">🎵 音樂</button>
        <button class="sub-cat-btn" onclick="setSubCat('展覽',this)">🖼️ 展覽</button>
        <button class="sub-cat-btn" onclick="setSubCat('旅遊',this)">✈️ 旅遊</button>
        <button class="sub-cat-btn" onclick="setSubCat('餐廳',this)">🍽️ 餐廳</button>
        <button class="sub-cat-btn" onclick="setSubCat('運動',this)">⚽ 運動</button>
        <button class="sub-cat-btn" onclick="setSubCat('其他',this)">💫 其他</button>
      </div>
    </div>
    <div class="form-group">
      <label>付款人</label>
      <select id="f-payer">
        <option value="海云🙆🏻‍♀️">海云🙆🏻‍♀️</option>
        <option value="智翔💁🏿‍♂️">智翔💁🏿‍♂️</option>
        <option value="共同">共同</option>
      </select>
    </div>
    <div class="form-group" id="split-group">
      <label>這筆怎麼算？</label>
      <div class="split-toggle">
        <button class="split-btn active" id="btn-shared" onclick="setSplit('shared')">🤝 兩人平分</button>
        <button class="split-btn" id="btn-solo" onclick="setSplit('solo')">👤 自己承擔</button>
      </div>
    </div>
    <div class="form-group"><label>日期</label><input type="date" id="f-date"></div>
    <button class="submit-btn" id="submit-btn" onclick="addRecord()">儲存紀錄</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://cpjauhhamlxysdcmmixa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HpSTKvbvPFoG5U91_aYwGg_1bb7XnEb';
const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const CAT_ICON = {'餐飲':'🍜','交通':'🚌','娛樂':'🎮','家庭':'🏠','訂閱':'📱','理理':'🐱','收入':'💰','其他':'📦'};
const CAT_CLASS = {'餐飲':'cat-food','交通':'cat-transport','娛樂':'cat-entertainment','家庭':'cat-home','訂閱':'cat-subscription','理理':'cat-other','收入':'cat-income','其他':'cat-other'};

let allRecords = [], allSettlements = [];
let curYear = new Date().getFullYear(), curMonth = new Date().getMonth();
let curType = 'expense', curSubCat = '電影', curFilter = 'all', curPerson = '海云🙆🏻‍♀️', curSplit = 'shared';

async function sbFetch(path, options={}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      ...(options.prefer ? {'Prefer': options.prefer} : {}), ...options.headers
    }
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadAll() {
  try {
    [allRecords, allSettlements] = await Promise.all([
      sbFetch('/rest/v1/records?select=*&order=date.desc,created_at.desc'),
      sbFetch('/rest/v1/settlements?select=*&order=settled_at.desc')
    ]);
    allRecords = allRecords || [];
    allSettlements = allSettlements || [];
    // remove settlements older than 7 days from display only
    render();
  } catch(e) { showToast('載入失敗，請重新整理'); console.error(e); }
}

function fmt(n) { return 'NT$' + Math.abs(Math.round(n)).toLocaleString(); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function monthRecords() {
  const pad = n => String(n).padStart(2,'0');
  const prefix = `${curYear}-${pad(curMonth+1)}`;
  return allRecords.filter(r => r.date && r.date.startsWith(prefix));
}
function isSettled(recordId) {
  return allSettlements.some(s => s.record_id === recordId);
}
function settledWithin7Days(recordId) {
  const s = allSettlements.find(s => s.record_id === recordId);
  if (!s) return false;
  const settledAt = new Date(s.settled_at);
  const diff = (Date.now() - settledAt.getTime()) / (1000*60*60*24);
  return diff <= 7;
}
function changeMonth(d) {
  curMonth += d;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  if (curMonth > 11) { curMonth = 0; curYear++; }
  render();
}
function switchSection(s, el) {
  document.querySelectorAll('.section').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
  document.getElementById('sec-'+s).classList.add('active');
  el.classList.add('active');
}
function setFilter(f, el) {
  curFilter = f;
  document.querySelectorAll('.filter-chip').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderRecords();
}
function setPerson(p, el) {
  curPerson = p;
  document.querySelectorAll('.person-btn').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderMine();
}
function openModal() {
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('modal-overlay').classList.add('open');
  updateSubCat();
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOutside(e) { if (e.target===document.getElementById('modal-overlay')) closeModal(); }
function setType(t) {
  curType = t;
  document.getElementById('btn-expense').classList.toggle('active', t==='expense');
  document.getElementById('btn-income').classList.toggle('active', t==='income');
  document.getElementById('cat-group').style.display = t==='income' ? 'none' : '';
  document.getElementById('split-group').style.display = t==='income' ? 'none' : '';
  if (t==='income') document.getElementById('subcat-group').style.display = 'none';
  else updateSubCat();
}
function setSplit(s) {
  curSplit = s;
  document.getElementById('btn-shared').classList.toggle('active', s==='shared');
  document.getElementById('btn-solo').classList.toggle('active', s==='solo');
}
function updateSubCat() {
  const cat = document.getElementById('f-cat').value;
  document.getElementById('subcat-group').style.display = (cat==='娛樂' && curType==='expense') ? 'block' : 'none';
}
function setSubCat(s, el) {
  curSubCat = s;
  document.querySelectorAll('.sub-cat-btn').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
}

async function addRecord() {
  const amount = parseFloat(document.getElementById('f-amount').value);
  const description = document.getElementById('f-desc').value.trim();
  const cat = curType==='income' ? '收入' : document.getElementById('f-cat').value;
  const subcat = cat==='娛樂' ? curSubCat : '';
  const payer = document.getElementById('f-payer').value;
  const date = document.getElementById('f-date').value;
  const split_type = curType==='income' ? 'solo' : curSplit;
  if (!amount || !description || !date) { showToast('請填寫金額、描述和日期'); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '儲存中...';
  try {
    await sbFetch('/rest/v1/records', {
      method: 'POST', prefer: 'return=minimal',
      body: JSON.stringify({type:curType, amount, description, cat, subcat, payer, date, split_type})
    });
    showToast('✅ 紀錄已儲存！');
    closeModal();
    document.getElementById('f-amount').value = '';
    document.getElementById('f-desc').value = '';
    await loadAll();
  } catch(e) { showToast('❌ 儲存失敗：' + e.message); console.error(e); }
  finally { btn.disabled = false; btn.textContent = '儲存紀錄'; }
}

async function deleteRecord(id) {
  if (!confirm('確定要刪除這筆紀錄嗎？')) return;
  try {
    await sbFetch(`/rest/v1/records?id=eq.${id}`, {method:'DELETE'});
    showToast('已刪除');
    await loadAll();
  } catch(e) { showToast('刪除失敗'); }
}

async function toggleSettle(recordId, currentlySettled) {
  try {
    if (currentlySettled) {
      await sbFetch(`/rest/v1/settlements?record_id=eq.${recordId}`, {method:'DELETE'});
      showToast('已取消結清');
    } else {
      await sbFetch('/rest/v1/settlements', {
        method:'POST', prefer:'return=minimal',
        body: JSON.stringify({record_id: recordId, settled_by: '手動結清'})
      });
      showToast('✅ 已標記結清！');
    }
    await loadAll();
  } catch(e) { showToast('操作失敗'); console.error(e); }
}

function recordCard(r, showDelete=false) {
  const isIncome = r.type==='income';
  const label = r.subcat ? `${r.cat} › ${r.subcat}` : r.cat;
  const splitLabel = r.split_type==='shared' ? '<span class="split-badge shared">平分</span>' : '<span class="split-badge solo">自付</span>';
  return `<div class="record-item">
    <div class="record-icon ${CAT_CLASS[r.cat]||'cat-other'}">${CAT_ICON[r.cat]||'📦'}</div>
    <div class="record-info">
      <div class="record-title">${r.description}${!isIncome ? splitLabel : ''}</div>
      <div class="record-meta">${r.payer} · ${label} · ${r.date}</div>
    </div>
    <div class="record-amount ${isIncome?'income':'expense'}">${isIncome?'+':'-'}${fmt(r.amount)}</div>
    ${showDelete ? `<button class="delete-btn" onclick="deleteRecord(${r.id})">🗑</button>` : ''}
  </div>`;
}

function renderOverview() {
  const mr = monthRecords();
  const expenses = mr.filter(r=>r.type==='expense');
  const incomes = mr.filter(r=>r.type==='income');
  const totalExp = expenses.reduce((s,r)=>s+Number(r.amount),0);
  const totalInc = incomes.reduce((s,r)=>s+Number(r.amount),0);
  const haiyunExp = expenses.filter(r=>r.payer==='海云🙆🏻‍♀️').reduce((s,r)=>s+Number(r.amount),0);
  const zhixiangExp = expenses.filter(r=>r.payer==='智翔💁🏿‍♂️').reduce((s,r)=>s+Number(r.amount),0);
  document.getElementById('ov-expense').textContent = fmt(totalExp);
  document.getElementById('ov-income').textContent = fmt(totalInc);
  document.getElementById('ov-haiyun').textContent = fmt(haiyunExp);
  document.getElementById('ov-zhixiang').textContent = fmt(zhixiangExp);

  // Settlement: only shared expenses
  const sharedExp = expenses.filter(r=>r.split_type==='shared');
  const sharedHaiyun = sharedExp.filter(r=>r.payer==='海云🙆🏻‍♀️').reduce((s,r)=>s+Number(r.amount),0);
  const sharedZhixiang = sharedExp.filter(r=>r.payer==='智翔💁🏿‍♂️').reduce((s,r)=>s+Number(r.amount),0);
  const diff = sharedHaiyun - sharedZhixiang;
  let txt;
  if (sharedExp.length===0) txt = '本月還沒有平分紀錄 🌸';
  else if (Math.abs(diff)<1) txt = '🎉 平分帳目均等！';
  else if (diff>0) txt = `智翔💁🏿‍♂️ 需還 海云🙆🏻‍♀️ ${fmt(diff/2)}`;
  else txt = `海云🙆🏻‍♀️ 需還 智翔💁🏿‍♂️ ${fmt(Math.abs(diff)/2)}`;
  document.getElementById('settlement-text').textContent = txt;

  // Checklist: shared expense items, not yet settled
  const pending = sharedExp.filter(r=>!isSettled(r.id));
  const done = sharedExp.filter(r=>settledWithin7Days(r.id));

  const pendingWrap = document.getElementById('settle-pending-wrap');
  const doneWrap = document.getElementById('settle-done-wrap');

  if (pending.length > 0) {
    pendingWrap.style.display = 'block';
    document.getElementById('settle-pending-list').innerHTML = pending.map(r => `
      <div class="settle-item">
        <div class="settle-check" onclick="toggleSettle(${r.id}, false)">${''}</div>
        <div class="settle-info">
          <div class="settle-desc">${r.description}</div>
          <div class="settle-meta">${r.payer} · ${r.date}</div>
        </div>
        <div class="settle-amt">各付 ${fmt(Number(r.amount)/2)}</div>
      </div>`).join('');
  } else { pendingWrap.style.display = 'none'; }

  if (done.length > 0) {
    doneWrap.style.display = 'block';
    document.getElementById('settle-done-list').innerHTML = done.map(r => `
      <div class="settle-item done">
        <div class="settle-check checked" onclick="toggleSettle(${r.id}, true)">✓</div>
        <div class="settle-info">
          <div class="settle-desc">${r.description}</div>
          <div class="settle-meta">${r.payer} · ${r.date}</div>
        </div>
        <div class="settle-amt">各付 ${fmt(Number(r.amount)/2)}</div>
      </div>`).join('');
  } else { doneWrap.style.display = 'none'; }

  const recent = mr.slice(0,5);
  document.getElementById('recent-list').innerHTML = recent.length
    ? recent.map(r=>recordCard(r)).join('')
    : '<div class="empty"><div class="emoji">📭</div>本月還沒有紀錄</div>';
}

function renderRecords() {
  const mr = monthRecords();
  let filtered = mr;
  if (curFilter==='支出') filtered = mr.filter(r=>r.type==='expense');
  else if (curFilter==='收入') filtered = mr.filter(r=>r.type==='income');
  else if (curFilter==='平分') filtered = mr.filter(r=>r.split_type==='shared');
  else if (curFilter==='自付') filtered = mr.filter(r=>r.split_type==='solo');
  else if (curFilter!=='all') filtered = mr.filter(r=>r.cat===curFilter);
  document.getElementById('records-list').innerHTML = filtered.length
    ? filtered.map(r=>recordCard(r,true)).join('')
    : '<div class="empty"><div class="emoji">🔍</div>沒有符合的紀錄</div>';
}

function renderStats() {
  const mr = monthRecords().filter(r=>r.type==='expense');
  const cats = ['餐飲','交通','娛樂','家庭','訂閱','理理','其他'];
  const catTotals = cats.map(c=>({cat:c, val:mr.filter(r=>r.cat===c).reduce((s,r)=>s+Number(r.amount),0)}));
  const maxCat = Math.max(...catTotals.map(c=>c.val),1);
  document.getElementById('cat-chart').innerHTML = catTotals.filter(c=>c.val>0).map(c=>
    `<div class="bar-row"><div class="bar-label">${CAT_ICON[c.cat]}${c.cat}</div><div class="bar-track"><div class="bar-fill" style="width:${c.val/maxCat*100}%"></div></div><div class="bar-val">${fmt(c.val)}</div></div>`
  ).join('') || '<div style="font-size:0.8rem;color:var(--ink2)">本月無支出資料</div>';
  const haiyun = mr.filter(r=>r.payer==='海云🙆🏻‍♀️').reduce((s,r)=>s+Number(r.amount),0);
  const zhixiang = mr.filter(r=>r.payer==='智翔💁🏿‍♂️').reduce((s,r)=>s+Number(r.amount),0);
  const maxP = Math.max(haiyun,zhixiang,1);
  document.getElementById('person-chart').innerHTML = [{name:'海云🙆🏻‍♀️',val:haiyun,cls:''},{name:'智翔💁🏿‍♂️',val:zhixiang,cls:'alt'}].map(p=>
    `<div class="bar-row"><div class="bar-label">${p.name}</div><div class="bar-track"><div class="bar-fill ${p.cls}" style="width:${p.val/maxP*100}%"></div></div><div class="bar-val">${fmt(p.val)}</div></div>`
  ).join('');
}

function renderMine() {
  const mr = monthRecords();
  let filtered;
  const soloNote = document.getElementById('p-solo-note');
  const sharedNote = document.getElementById('p-shared-note');
  soloNote.style.display = 'none'; sharedNote.style.display = 'none';

  if (curPerson === '共同') {
    filtered = mr.filter(r=>r.type==='expense' && r.split_type==='shared');
    sharedNote.style.display = 'block';
  } else {
    filtered = mr.filter(r=>r.payer===curPerson && r.type==='expense' && r.split_type==='solo');
    soloNote.style.display = 'block';
  }
  const exp = filtered.reduce((s,r)=>s+Number(r.amount),0);
  const inc = curPerson !== '共同' ? mr.filter(r=>r.payer===curPerson && r.type==='income').reduce((s,r)=>s+Number(r.amount),0) : 0;
  document.getElementById('p-expense').textContent = fmt(exp);
  document.getElementById('p-income').textContent = fmt(inc);
  const emoji = curPerson==='共同' ? '🏠' : '🌸';
  document.getElementById('person-list').innerHTML = filtered.length
    ? filtered.map(r=>recordCard(r,true)).join('')
    : `<div class="empty"><div class="emoji">${emoji}</div>本月還沒有紀錄</div>`;
}

function render() {
  const label = `${curYear} 年 ${MONTHS[curMonth]}`;
  ['','2','3','4'].forEach(s => { const el = document.getElementById('monthLabel'+s); if(el) el.textContent = label; });
  document.getElementById('headerMonth').textContent = MONTHS[curMonth];
  renderOverview(); renderRecords(); renderStats(); renderMine();
}
loadAll();
</script>
</body>
</html>
